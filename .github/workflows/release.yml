name: Release

# Pushing a tag like v1.2.3 runs CI and publishes the image to GHCR:
# ghcr.io/<owner>/<repo>:1.2.3, :1.2, :1 and :latest (amd64 + arm64).
# Once the repo is public it also publishes the package to npm and the MCP server to the MCP Registry.
# Last it creates the GitHub release, with the entry for the version in CHANGELOG.md as its notes.
# The tag has to match the version in package.json, as spurlos names that version in its user agent.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  version:
    name: Tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, package.json says $version"
            exit 1
          fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  image:
    name: Build and push image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  npm:
    name: Publish to npm
    needs: ci
    # npm attaches provenance only for public repositories; while the repo is private, releases skip npm
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing: npm trusts this workflow, no token in the secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # trusted publishing needs npm 11.5.1 or newer; pinned, as this step holds the token that may publish
      - run: npm install -g npm@11.21.3
      - run: npm publish --access public

  mcp:
    name: Publish to the MCP Registry
    # the registry checks mcpName in the npm package, so this runs after the npm job
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the registry trusts this repository for io.github.mmohrx/*, no token in the secrets
    env:
      # pinned with its checksum; to update, take version and sha256 from the release's checksums.txt
      MCP_PUBLISHER_VERSION: v1.8.16
      MCP_PUBLISHER_SHA256: 6e2f799550cf843c6fd3350498d56cc49be3dc0af1e6237eb0e6435c7a9d5c05
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      # server.json takes the version of the tag, which the version job has checked against package.json
      - run: |
          version=${GITHUB_REF_NAME#v}
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
      # the registry asks npm for the version, which takes a moment after npm publish; wait up to 5 minutes
      - run: |
          for i in $(seq 30); do
            curl -fs "https://registry.npmjs.org/spurlos/${GITHUB_REF_NAME#v}" > /dev/null && exit 0
            sleep 10
          done
          echo "::error::npm does not know spurlos@${GITHUB_REF_NAME#v} after 5 minutes"
          exit 1
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  release:
    name: GitHub release
    # the action is listed on the GitHub Marketplace, and each new release shows up there by itself
    needs: [image, npm]
    # without the npm job (private repo) it is skipped, and with it the release still follows the image
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.npm.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the notes are the entry for this version in CHANGELOG.md, without its heading
      - run: |
          version=${GITHUB_REF_NAME#v}
          awk -v h="## $version " 'index($0, h) == 1 { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no entry for $version"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
